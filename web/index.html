<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <header class="hero">
        <h1>👋 Build Your Personal Profile</h1>
        <p>Fill in the form below and see your profile card come to life.</p>
    </header>

    <main class="card">
        <!-- Form data is sent to the ProfileServlet using HTTP POST -->
        <form action="profile" method="post" id="profileForm">

            <div class="field">
                <label for="name">👤 Full Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. Ahmad Danial" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="studentId">🆔 Student ID</label>
                    <input type="text" id="studentId" name="studentId" placeholder="e.g. 2023123456"
                           pattern="[0-9]{10}" title="Enter a 10-digit student ID" required>
                </div>
                <div class="field">
                    <label for="program">🎓 Program</label>
                    <select id="program" name="program" required>
                        <option value="" disabled selected>Select your program</option>
                        <option>CS110 - Diploma in Computer Science</option>
                        <option>CS230 - Bachelor of Information Systems Engineering</option>
                        <option>CS240 - Bachelor of Computer Science (Hons.)</option>
                        <option>CS241 - Bachelor of Computer Science (Hons.) Netcentric Computing</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="email">📧 Email</label>
                <input type="email" id="email" name="email" placeholder="you@student.uitm.edu.my" required>
            </div>

            <div class="field">
                <span class="label">🎯 Hobbies</span>
                <div class="chips">
                    <label class="chip"><input type="checkbox" name="hobbies" value="Coding"><span>💻 Coding</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Gaming"><span>🎮 Gaming</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Reading"><span>📚 Reading</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Music"><span>🎵 Music</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Sports"><span>⚽ Sports</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Travelling"><span>✈️ Traveling</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Photography"><span>📷 Photography</span></label>
                    <label class="chip"><input type="checkbox" name="hobbies" value="Cooking"><span>🍳 Cooking</span></label>
                </div>
            </div>

            <div class="field">
                <label for="intro">✍️ Short Self-Introduction</label>
                <textarea id="intro" name="intro" rows="4" maxlength="300"
                          placeholder="Tell us a little about yourself..." required></textarea>
                <small class="counter"><span id="count">0</span> / 300</small>
            </div>

            <div class="actions">
                <button type="reset" class="btn btn-ghost">Reset</button>
                <button type="submit" class="btn btn-primary">Generate Profile 🚀</button>
            </div>
        </form>
    </main>

    <footer>CSC584 &middot; Individual Assignment 1</footer>
</div>

<script>
    // Simple JavaScript: live character counter for the introduction box
    var intro = document.getElementById('intro');
    var count = document.getElementById('count');
    intro.addEventListener('input', function () { count.textContent = intro.value.length; });
    document.getElementById('profileForm').addEventListener('reset', function () { count.textContent = 0; });
</script>
</body>
</html>
